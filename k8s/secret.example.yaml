# Copy this file to secret.yaml, fill in real values, and DO NOT
# commit secret.yaml (it's covered by the repo's .gitignore - see
# k8s/README.md). Apply it before the Deployment:
#
#   kubectl apply -f k8s/secret.yaml
#
# In Rancher's UI you can instead create this via Cluster Explorer
# -> Storage/Secrets -> "Create from YAML", or Project -> Secrets ->
# Add Secret, and skip this file entirely.

apiVersion: v1
kind: Secret
metadata:
  name: lead-validator-secrets
  namespace: lead-validator
type: Opaque
stringData:
  # Password the GUI's login page requires. Required for any
  # non-local deployment - without it the app runs with NO login
  # protection (it logs a warning and lets anyone in).
  APP_PASSWORD: "choose-a-strong-password"

  # Signs the login session cookie. Generate one with:
  #   python -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: "replace-with-a-random-64-char-hex-string"
