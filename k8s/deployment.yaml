apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-validator
  namespace: lead-validator
  labels:
    app: lead-validator
spec:
  replicas: 1
  # Only one browser-driven job runs at a time (see webapp/app.py),
  # and data is on a ReadWriteOnce volume a second pod couldn't
  # mount anyway - Recreate avoids two pods overlapping during a
  # rolling update.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lead-validator
  template:
    metadata:
      labels:
        app: lead-validator
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: lead-validator
          # Build & push this image first - see k8s/README.md.
          image: your-registry.example.com/lead-validator:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: lead-validator-secrets
          env:
            - name: PORT
              value: "8000"
          volumeMounts:
            - name: data
              mountPath: /app/webapp/data
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            # A batch in progress can briefly starve the event loop
            # (see webapp/app.py's /run-batch threadpool note) -
            # give liveness some slack before Kubernetes restarts
            # the pod mid-job.
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lead-validator-data
